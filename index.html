<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Fantasy CTA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene">

    <div class="fog fog-one"></div>
    <div class="fog fog-two"></div>

    <div class="stars"></div>

    <section class="cta">

      <div class="rune rune-left">ᛉ</div>
      <div class="rune rune-right">ᛟ</div>

      <div class="sigil">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="eyebrow">THE FORBIDDEN PATH</p>

      <h1>
        <span>ENTER THE</span>
        <strong>ABYSS</strong>
      </h1>

      <p class="description">
        Beyond the veil lies a world forgotten by time.
        Only those who dare may cross its threshold.
      </p>

      <button class="cta-button" id="enterButton">
        <span class="button-glow"></span>
        <span class="button-text">ENTER THE DARKNESS</span>
        <span class="arrow">→</span>
      </button>

      <div class="status">
        <span class="status-dot"></span>
        THE GATE IS OPEN
      </div>

    </section>

    <footer class="developer-credit">
      <span>DESIGNED &amp; DEVELOPED BY</span>
      <strong>SINA REZAEI</strong>
    </footer>

  </main>

  <div class="overlay" id="overlay">
    <div class="portal"></div>
    <p>THE ABYSS AWAKENS...</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
